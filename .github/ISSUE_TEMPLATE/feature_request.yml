name: 💡 Feature Request
description: Suggest an idea or enhancement for DocTransfer
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new feature or improvement!

  - type: input
    id: title
    attributes:
      label: Feature Title
      description: A concise title for the proposed feature.
      placeholder: e.g. Add support for Box and Dropbox cloud import
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Use Case
      description: Is your feature request related to a problem or limitation? Please describe.
      placeholder: e.g. Currently users can only import from Google Drive, but many enterprise users store documents in Dropbox.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false

  - type: dropdown
    id: willing-to-contribute
    attributes:
      label: Would you be interested in submitting a PR for this feature?
      options:
        - "Yes, I can submit a PR!"
        - "Yes, with some guidance"
        - "No, just proposing the idea"
    validations:
      required: true
