name: 🐛 Bug Report
description: File a bug report to help us fix issues in DocTransfer
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of what the bug is.
      placeholder: e.g. Document preview fails when file size exceeds 25MB
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Step by step instructions to reproduce the bug.
      placeholder: |
        1. Go to '/data-room'
        2. Click on 'Upload Document'
        3. Enable 'Client-Side Encryption'
        4. See error in console
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened instead.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Operating System, Browser, Node.js version, and deployment environment.
      placeholder: |
        - OS: [e.g. Windows 11 / macOS Sonoma / Ubuntu 22.04]
        - Browser: [e.g. Chrome 124, Safari 17, Firefox 125]
        - Node version: [e.g. v20.11.0]
        - Deployment: [e.g. Local dev / Vercel / Netlify / Self-hosted]
    validations:
      required: false

  - type: textarea
    id: logs-screenshots
    attributes:
      label: Logs / Screenshots
      description: Attach relevant console errors, stack traces, or screenshots.
    validations:
      required: false
